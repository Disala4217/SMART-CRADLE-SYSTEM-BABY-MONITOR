<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Smart Cradle Dashboard</title>

<style>
    body {
        font-family: sans-serif;
        text-align: center;
        padding: 50px;
    }

    .card {
        padding: 40px;
        border-radius: 20px;
        color: white;
        display: inline-block;
        width: 300px;
        transition: 0.3s;
    }

    .normal { background-color: #27ae60; }
    .sad { background-color: #c0392b; }
    .abnormal { background-color: #f39c12; }
    .no_baby { background-color: #2c3e50; animation: blink 1s infinite; }
    .offline { background-color: #34495e; animation: blink 1s infinite; }

    @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
</style>
</head>

<body>

<h1>👶 Smart Cradle Monitor</h1>

<div id="status-card" class="card">
    <h2 id="status">Loading...</h2>
    <p>Confidence: <span id="conf">--</span>%</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔥 Firebase config
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "smart-cradle-baby-monitoring.firebaseapp.com",
    databaseURL: "https://smart-cradle-baby-monitoring-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "smart-cradle-baby-monitoring",
    storageBucket: "smart-cradle-baby-monitoring.firebasestorage.app",
    messagingSenderId: "304550138577",
    appId: "1:304550138577:web:45217057e97ce6cb8c6bf0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const statusRef = ref(db, 'baby_status');

// =========================
// STATE TRACKING
// =========================
let lastUpdateTime = Date.now();
let lastState = null;
let lastAlertTime = 0;
let missingWritten = false;

const ALERT_COOLDOWN = 5000;      // prevent spam
const OFFLINE_TIMEOUT = 120000;    // 2 minutes

// 🔊 sound
const alertSound = new Audio("song.mp3");

function playAlertSound() {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
}

// 🔔 notifications
if ("Notification" in window) {
    Notification.requestPermission();
}

function sendNotification(msg) {
    if (Notification.permission === "granted") {
        new Notification("👶 Smart Cradle Alert", {
            body: msg,
            icon: "https://cdn-icons-png.flaticon.com/512/4645/4645949.png"
        });
    }
}

// unlock audio
document.body.addEventListener("click", () => {
    alertSound.play().then(() => alertSound.pause()).catch(()=>{});
}, { once: true });


// =========================
// FIREBASE LISTENER
// =========================
onValue(statusRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;

    lastUpdateTime = Date.now();
    missingWritten = false; // reset offline flag when data returns

    const state = data.state;
    const now = Date.now();

    const statusDiv = document.getElementById("status");
    const card = document.getElementById("status-card");

    // UI update
    statusDiv.innerText = state.toUpperCase();
    document.getElementById("conf").innerText =
        data.confidence ? (data.confidence * 100).toFixed(1) : "--";

    card.className = "card " + state;

    // alert logic (no spam)
    const shouldAlert =
        state !== lastState &&
        (now - lastAlertTime > ALERT_COOLDOWN);

    if (shouldAlert) {
        lastAlertTime = now;

        if (state === "sad") {
            sendNotification("Baby is crying!");
            playAlertSound();
        }
        else if (state === "abnormal") {
            sendNotification("Abnormal behavior detected!");
            playAlertSound();
        }
        else if (state === "no_baby") {
            sendNotification("Baby is missing!");
            playAlertSound();
        }
    }

    lastState = state;
});


// =========================
// OFFLINE + AUTO WRITE TO FIREBASE
// =========================
setInterval(async () => {
    const now = Date.now();
    const statusDiv = document.getElementById("status");
    const card = document.getElementById("status-card");

    if (now - lastUpdateTime > OFFLINE_TIMEOUT) {

        // show UI
        statusDiv.innerText = "🚨 BABY MISSING (NO RESPONSE)";
        document.getElementById("conf").innerText = "--";
        card.className = "card no_baby";

        // only write once to Firebase
        if (!missingWritten) {
            missingWritten = true;

            await update(ref(db, "baby_status"), {
                state: "no_baby",
                confidence: 0,
                timestamp: Date.now()
            });

            sendNotification("Baby is missing (no device response)!");
            playAlertSound();
        }
    }

}, 5000);

</script>

</body>
</html>
