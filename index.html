<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Cradle Monitor</title>

<!-- Google Font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: 'Poppins', sans-serif;
    }

    body {
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #74ebd5, #ACB6E5);
    }

    .container {
        text-align: center;
    }

    h1 {
        color: #fff;
        margin-bottom: 30px;
        font-weight: 600;
    }

    .card {
        width: 320px;
        padding: 40px;
        border-radius: 25px;
        backdrop-filter: blur(15px);
        background: rgba(255, 255, 255, 0.15);
        box-shadow: 0 8px 32px rgba(0,0,0,0.2);
        color: white;
        transition: all 0.4s ease;
        position: relative;
        overflow: hidden;
    }

    .card::before {
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        background: rgba(255,255,255,0.1);
        transform: rotate(45deg);
        top: -50%;
        left: -50%;
    }

    .status-text {
        font-size: 28px;
        font-weight: 600;
        margin-bottom: 10px;
    }

    .confidence {
        font-size: 18px;
        opacity: 0.9;
    }

    .emoji {
        font-size: 50px;
        margin-bottom: 15px;
    }

    /* States */
    .normal { background: linear-gradient(135deg, #00b09b, #96c93d); }
    .sad { background: linear-gradient(135deg, #e53935, #e35d5b); }
    .abnormal { background: linear-gradient(135deg, #f7971e, #ffd200); }

</style>
</head>
<body>

<div class="container">
    <h1>👶 Smart Cradle Monitor</h1>
    <div id="status-card" class="card">
        <div class="emoji" id="emoji">⏳</div>
        <div class="status-text" id="status">Loading...</div>
        <div class="confidence">Confidence: <span id="conf">--</span>%</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqZsE4CK50KaIPUA0ClwEfcba9C-C9lSQ",
        authDomain: "smart-cradle-baby-monitoring.firebaseapp.com",
        databaseURL: "https://smart-cradle-baby-monitoring-default-rtdb.asia-southeast1.firebasedatabase.app",
        projectId: "smart-cradle-baby-monitoring",
        storageBucket: "smart-cradle-baby-monitoring.firebasestorage.app",
        messagingSenderId: "304550138577",
        appId: "1:304550138577:web:45217057e97ce6cb8c6bf0",
        measurementId: "G-HMJZN333XD"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const statusRef = ref(db, 'baby_status');

    const emojiMap = {
        normal: "😴",
        sad: "😭",
        abnormal: "⚠️"
    };

    onValue(statusRef, (snapshot) => {
        const data = snapshot.val();
        if (data) {
            const statusDiv = document.getElementById("status");
            const card = document.getElementById("status-card");
            const emoji = document.getElementById("emoji");

            statusDiv.innerText = data.state.toUpperCase();
            document.getElementById("conf").innerText = (data.confidence * 100).toFixed(1);

            card.className = "card " + data.state;
            emoji.innerText = emojiMap[data.state] || "🤔";
        }
    });
</script>

</body>
</html>
