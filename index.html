<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Baby Monitor Dashboard</title>

<style>
    body {
        font-family: sans-serif;
        text-align: center;
        padding: 50px;
    }

    .card {
        padding: 40px;
        border-radius: 20px;
        color: white;
        display: inline-block;
        width: 300px;
        transition: 0.3s;
    }

    .normal { background-color: #27ae60; }
    .sad { background-color: #c0392b; }
    .abnormal { background-color: #f39c12; }

    .no_baby {
        background-color: #2c3e50;
        animation: blink 1s infinite;
    }

    .offline {
        background-color: #34495e;
        animation: blink 1s infinite;
    }

    @keyframes blink {
        0% { opacity: 1; }
        50% { opacity: 0.5; }
        100% { opacity: 1; }
    }
</style>
</head>

<body>

<h1>👶 Smart Cradle Monitor</h1>

<div id="status-card" class="card">
    <h2 id="status">Loading...</h2>
    <p>Confidence: <span id="conf">--</span>%</p>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

// 🔥 Firebase config
const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "smart-cradle-baby-monitoring.firebaseapp.com",
    databaseURL: "https://smart-cradle-baby-monitoring-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "smart-cradle-baby-monitoring",
    storageBucket: "smart-cradle-baby-monitoring.firebasestorage.app",
    messagingSenderId: "304550138577",
    appId: "1:304550138577:web:45217057e97ce6cb8c6bf0"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const statusRef = ref(db, 'baby_status');

// 🧠 last update tracker
let lastUpdateTime = Date.now();

// 🔊 sound
const alertSound = new Audio("song.mp3");

function playAlertSound() {
    alertSound.currentTime = 0;
    alertSound.play().catch(()=>{});
}

// 🔔 notifications
if ("Notification" in window) {
    Notification.requestPermission();
}

function sendNotification(msg) {
    if (Notification.permission === "granted") {
        new Notification("👶 Smart Cradle Alert", {
            body: msg,
            icon: "https://cdn-icons-png.flaticon.com/512/4645/4645949.png"
        });
    }
}

// 🔥 unlock audio (required by browser)
document.body.addEventListener("click", () => {
    alertSound.play().then(() => {
        alertSound.pause();
    }).catch(()=>{});
}, { once: true });


// ==========================
// 🔥 FIREBASE LISTENER
// ==========================
onValue(statusRef, (snapshot) => {
    const data = snapshot.val();

    if (data) {
        lastUpdateTime = Date.now();

        const statusDiv = document.getElementById("status");
        const card = document.getElementById("status-card");

        let state = data.state;

        // 🔥 DISPLAY LOGIC
        if (state === "sad") {
            statusDiv.innerText = "😢 BABY IS SAD";
            playAlertSound();
            sendNotification("Baby is crying!");
        }

        else if (state === "abnormal") {
            statusDiv.innerText = "⚠ BABY ABNORMAL";
            playAlertSound();
            sendNotification("Abnormal behavior detected!");
        }

        else if (state === "no_baby") {
            statusDiv.innerText = "🚨 NO BABY DETECTED";
            playAlertSound();
            sendNotification("Baby is missing!");
        }

        else {
            statusDiv.innerText = state.toUpperCase();
        }

        document.getElementById("conf").innerText =
            (data.confidence * 100).toFixed(1);

        card.className = "card " + state;
    }
});


// ==========================
// ⚠ OFFLINE DETECTION
// ==========================
setInterval(() => {
    const now = Date.now();

    if (now - lastUpdateTime > 120000) { // 2 minutes

        const statusDiv = document.getElementById("status");
        const card = document.getElementById("status-card");

        statusDiv.innerText = "⚠ SYSTEM OFFLINE";
        document.getElementById("conf").innerText = "--";

        card.className = "card offline";
    }
}, 5000);

</script>

</body>
</html>
